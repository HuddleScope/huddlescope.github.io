# GitHub Actions CI/CD workflow for HuddleScope
# See docs/ci-status.md for status and known issues

name: CI

on:
  # Branches that have an open PR are covered by pull_request; push only
  # checks main so each commit runs CI once and a merge commit to main does
  # not duplicate the PR run. (master is the legacy alias of main.)
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# A newer commit on the same PR (or branch) cancels the run in progress, so
# queued and in-flight runs do not run concurrently.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name is the required status check of the main-branch ruleset
  # ("Require CI before merging to main"): merges to main are blocked until
  # this check passes.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install linters
        # The Makefile expects golangci-lint, gosec and govulncheck on PATH
        # (it documents local Homebrew installs). On a clean runner they are
        # absent, so install them here.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Test (race, vet)
        run: make test

      - name: Format (gofmt)
        run: |
          files=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*' -not -path './dist/*'))
          if [ -n "$files" ]; then
            echo "Error: gofmt found files that need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Lint
        run: make lint

      - name: Security (gosec, govulncheck)
        run: make security

      - name: Coverage gate (>= 80% on internal packages)
        run: make check-coverage

      - name: Build binaries
        run: make build

      - name: Install Hugo extended
        run: |
          HUGO_VERSION="0.169.0"
          HUGO_BINARY="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_BINARY}" | tar -xzf - hugo
          sudo mv hugo /usr/local/bin/
          echo "Hugo version: $(hugo version)"

      - name: Verify binaries
        run: ls -la dist/

  # Scheduled worker: Cloudflare Worker Cron
  # Independent job — does not block merges (not a required status check)
  scheduler:
    name: Scheduler worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scheduler
        run: npm install

      - name: Run tests
        working-directory: scheduler
        run: npm test
