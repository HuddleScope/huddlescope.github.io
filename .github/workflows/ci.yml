# GitHub Actions CI/CD workflow for HuddleScope
# See docs/ops-runbook.md for status and known issues

name: CI

on:
  # Branches that have an open PR are covered by pull_request; push only
  # checks main so each commit runs CI once and a merge commit to main does
  # not duplicate the PR run. (master is the legacy alias of main.)
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# A newer commit on the same PR (or branch) cancels the run in progress, so
# queued and in-flight runs do not run concurrently.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name is the required status check of the main-branch ruleset
  # ("Require CI before merging to main"): merges to main are blocked until
  # this check passes.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Go changes
        # Lint and security steps only run when the change touches Go sources
        # (PR file list via API; for pushes to main, compare the push range).
        # Site-data PRs (web/data/*.json only) pass Build without the ~4 min
        # linter/gosec/govulncheck pass.
        id: go-changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "has_go=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            FILES=$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${{ github.sha }}" --jq '.files[].filename')
          fi
          if printf '%s\n' "$FILES" | grep -qE '\.go$|^go\.(mod|sum)$'; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install linters
        if: steps.go-changes.outputs.has_go == 'true'
        # The Makefile expects golangci-lint, gosec and govulncheck on PATH
        # (it documents local Homebrew installs). On a clean runner they are
        # absent, so install them here.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Test (race, vet)
        run: make test

      - name: Format (gofmt)
        run: |
          # shellcheck disable=SC2046  # gofmt needs one argument per file
          files=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*' -not -path './dist/*'))
          if [ -n "$files" ]; then
            echo "Error: gofmt found files that need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Lint
        if: steps.go-changes.outputs.has_go == 'true'
        run: make lint

      - name: Security (gosec, govulncheck)
        if: steps.go-changes.outputs.has_go == 'true'
        run: make security

      - name: Coverage gate (>= 80% on internal packages)
        run: make check-coverage

      - name: Build binaries
        run: make build

      # Native smoke checks (AC-2/AC-4): the stamped, locally-built binary must
      # start, report its version/revision/build-info/target, and run
      # `config check` against the default dev config without a network.
      - name: Smoke (version / --help / config check)
        run: |
          ./dist/huddlescope version
          ./dist/huddlescope --help
          ./dist/huddlescope config check

      # E2E matrix (offline) — issue #165 / HS-PORT-09 / AC-1, AC-2. Runs the
      # binary-level suite (execs the built CLI against a 127.0.0.1 fixture RSS
      # server + a local sqlite-file DB) and the failover suite (8 scenarios
      # against the real sqlite-file backend + shared lease, build tag `e2e`).
      # Purely offline: no TURSO_* / GITHUB_* env (the script refuses to run if
      # any are present), DBs in temp dirs, no external feeds, no web/data writes.
      - name: E2E matrix (offline)
        run: make e2e

      - name: Install Hugo extended
        run: |
          HUGO_VERSION="0.169.0"
          HUGO_BINARY="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_BINARY}" | tar -xzf - hugo
          sudo mv hugo /usr/local/bin/
          echo "Hugo version: $(hugo version)"

      - name: Verify binaries
        run: ls -la dist/

  # Cross-architecture static build matrix (issue #161 AC-7): proves the
  # single binary cross-compiles with CGO_ENABLED=0 and stays static on every
  # release target per-PR. The release workflow (build-and-release.yaml) also
  # enforces the readelf NEEDED check on its own linux artifacts; this job is
  # the per-PR guard so a cgo-gated transitive dep is caught before release.
  cross-build:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: linux,  goarch: arm,   goarm: '7' }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: version
        run: echo "version=$(bash scripts/resolve-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile static binary (CGO_ENABLED=0, -trimpath)
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/HuddleScope/huddlescope.github.io/internal/cli.cliVersion=${{ steps.version.outputs.version }}" \
            -o "huddlescope_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}" \
            ./cmd/huddlescope

      - name: Verify static linking (ELF targets)
        if: matrix.goos == 'linux'
        run: |
          BIN="huddlescope_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if readelf -d "$BIN" 2>/dev/null | grep -q NEEDED; then
            echo "FAIL: $BIN has a dynamic (NEEDED) section" >&2
            exit 1
          fi
          echo "OK: $BIN is statically linked"

  # Scheduled worker: Cloudflare Worker Cron
  # Independent job — does not block merges (not a required status check)
  scheduler:
    name: Scheduler worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scheduler
        run: npm install

      - name: Run tests
        working-directory: scheduler
        run: npm test
