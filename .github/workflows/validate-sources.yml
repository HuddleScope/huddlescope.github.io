name: Validate RSS Sources

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate RSS sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Validate configuration
        run: |
          set -euo pipefail
          echo "Validating RSS sources configuration..."
          
          # Run ingest in check mode to validate configuration
          ./dist/ingest --check || {
            echo "::error::Configuration validation failed. See ingest --check output above."
            exit 1
          }
          
          echo "✅ Configuration valid. All RSS source entries parse correctly."

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: |
            /tmp/*.log
            ${{ github.workspace }}/web/data/feeds.json
          retention-days: 7
