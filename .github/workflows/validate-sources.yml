name: Validate RSS Sources
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  validate:
    name: Validate RSS sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Run make build
        run: make build
      - name: Validate RSS sources
        run: |
          set -euo pipefail
          ./dist/feedcheck -json > /tmp/feedcheck-report.json || true
          cat /tmp/feedcheck-report.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feedcheck-report
          path: /tmp/feedcheck-report.json
          retention-days: 7
        continue-on-error: true
