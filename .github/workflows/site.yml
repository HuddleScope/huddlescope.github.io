# GitHub Actions workflow for HuddleScope site build
# HS-014: Bootstrap Hugo and responsive site design
#
# Site publication:
#   - pull_request: fixture build + verification only (no deploy).
#   - workflow_run: when the CI workflow completes with success on main,
#     rebuild the production site from the committed data (real snapshot,
#     never the fixtures) and deploy it to GitHub Pages. A failed or
#     cancelled CI run deploys nothing, and the last successfully deployed
#     Pages content is preserved.

name: Site

on:
  pull_request:
    branches: [ main, master ]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    name: Build site
    # Runs on PRs, and on CI success for main (deploy job follows it).
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          HUGO_VERSION="0.169.0"
          HUGO_BINARY="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_BINARY}" | tar -xzf - hugo
          sudo mv hugo /usr/local/bin/
          echo "Hugo version: $(hugo version)"

      - name: Run site verification
        run: |
          chmod +x scripts/site-test.sh
          bash scripts/site-test.sh

      - name: Upload site artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: web/public/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy to Pages
    needs: site
    # Production deploy only after a green CI run that completed on main.
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo extended
        run: |
          HUGO_VERSION="0.169.0"
          HUGO_BINARY="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_BINARY}" | tar -xzf - hugo
          sudo mv hugo /usr/local/bin/
          echo "Hugo version: $(hugo version)"

      - name: Build Hugo site
        run: |
          # site-test.sh leaves web/public from fixtures in other runs;
          # Hugo does not delete stale outputs, so start clean to guarantee
          # the deployable artifact is the real-data build.
          rm -rf web/public
          make site

      - name: Verify no demo markers
        run: |
          # The production build must never contain the demo sample.
          # Hard fail before any Pages upload (same guard as refresh-news).
          MARKERS='example\.com|seed-run-|top-free-agents-2024|pro-bowl-2025-format|preseason-week-1-overview'
          HITS=$(grep -RInE "$MARKERS" web/public/ 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Demo markers found in production build:"
            echo "$HITS"
            exit 1
          fi
          echo "No demo markers in web/public/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/public/

      - name: Deploy to Pages
        uses: actions/deploy-pages@v5
