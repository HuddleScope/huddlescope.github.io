# GitHub Actions workflow for HuddleScope site build
# HS-014: Bootstrap Hugo and responsive site design

name: Site

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          HUGO_VERSION="0.169.0"
          HUGO_BINARY="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_BINARY}" | tar -xzf - hugo
          sudo mv hugo /usr/local/bin/
          echo "Hugo version: $(hugo version)"

      - name: Run site verification
        run: |
          chmod +x scripts/site-test.sh
          bash scripts/site-test.sh

      - name: Upload site artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: web/public/
          retention-days: 7
          if-no-files-found: ignore