# GitHub Actions workflow for HuddleScope refresh and Pages deployment
# HS-018: Create GitHub Actions refresh and Pages deployment workflow
# Triggered manually via workflow_dispatch (Cloudflare is the authoritative scheduler)
#
# Issue #247 / PUB-01: generated Hugo data is NO LONGER committed to Git. The
# publish gate compares the freshly exported candidate against the deployed
# manifest stored durably in the shared database (Turso in production), not a
# committed web/data/deployed.json file. The deploy manifest is read with
# `publish manifest get` before the gate and written with `publish manifest
# put` after a successful Pages deploy — no Git commits, branches, or PRs for
# news data (AC-3). The gate uses --require-manifest so a fresh checkout with
# no stored manifest DENIES (fail closed) instead of deploying an empty site
# (AC-6).
#
# Issue #252 / PUB-06: retention/archival is ISOLATED to the dedicated
# retention.yml maintenance workflow (weekly schedule + manual dispatch,
# dry-run by default). This workflow never deletes rows, never exports a
# retention package, and commits no archive files — it holds no Git-mutation
# permission for retention (no contents:write, no PAT).
#
# HS-056: the legacy "data safety guard" is removed. An explicit publish
# decision gates the Pages upload and the deploy job:
#   - exported snapshot has >= 1 story and is newer/different -> deploy
#   - zero stories vs a stored manifest with > 0 -> deny (retain last-good)
#   - identical content to the stored manifest -> skip (quiesce)
# A failed ingest/export/manifest-get fails the build job, so the deploy job
# is skipped and the last successfully deployed Pages content is preserved.
#
# HS-PORT-07 (issue #163): ingest is a BACKUP that runs only when Turso is
# stale (>75 min). A `should-run` decision step (fail-closed on DB error)
# gates the ingest step; export and site-data re-projection always run so the
# workspace web/data files stay coherent with Turso even when ingest is
# skipped. Site-data writes are workspace-only (HSC_PUBLISH_SITE_DATA=true);
# they are untracked/ignored, not committed.

name: Refresh news

on:
  # Manually trigger a news refresh and optional Pages deployment
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy to Pages after successful build'
        required: true
        default: 'true'
        type: boolean
      force_ingest:
        description: 'Force backup ingest even if Turso is fresh (maintenance only; still respects the distributed lease)'
        required: false
        default: 'false'
        type: boolean
      restore_artifact:
        description: 'Manual recovery (issue #249 / PUB-03): name of a site-snapshot-<id> artifact to restore into the workspace (empty = normal run; DB steps are skipped, deploy still requires publish=true)'
        required: false
        default: ''
        type: string

# Issue #229 / AC-3: cancel-in-progress: false prevents a new dispatch from
# cancelling a run inside the publish window. Refreshes serialize instead of
# racing.
concurrency:
  group: huddlescope-pages-deploy
  cancel-in-progress: false

# Least privilege: default read access. This workflow performs NO Git
# mutation (issue #252: retention-only commit removed; retention/archival is
# isolated to retention.yml). The deploy job needs pages:write +
# id-token:write for its OIDC Pages deploy.
permissions:
  contents: read

jobs:
  build:
    name: Refresh and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    outputs:
      deploy: ${{ steps.publish-gate.outputs.deploy }}
    env:
      HSC_ENV: production
      HSC_STORAGE_BACKEND: turso
      HSC_RUNNER_ORIGIN: github-backup
      # issue #158 / AC-5 + issue #247: GitHub Actions runs in the repo, so it
      # publishes the site-data files (heartbeat.json + feeds.json) to the
      # workspace. With issue #247 the files are untracked/ignored; a repo-less
      # VPS/Raspberry host leaves this unset (auto) and skips the writes in
      # production.
      HSC_PUBLISH_SITE_DATA: "true"
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      HSC_HUGO_BASE_URL: https://huddlescope.github.io/
      HSC_USER_AGENT: huddlescope-ci/0.1 (+https://huddlescope.github.io/)
      HSC_LOOKBACK: 24h
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "HuddleScope CI"
          git config user.email "ci@huddlescope.github.io"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build unified CLI
        run: make build-huddlescope

      # Issue #249 / PUB-03 (AC-4): manual recovery. When the operator names a
      # site-snapshot artifact, it is downloaded and restored into the Hugo
      # workspace BEFORE any DB step; the DB steps (decision/ingest/export/
      # package/manifest-get) are then skipped. Recovery works with Turso
      # unavailable. Deploy still requires the explicit publish=true input; no
      # automatic rollback to older snapshots is ever performed.
      - name: Download snapshot artifact for restore
        id: download-restore-artifact
        if: inputs.restore_artifact != ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.restore_artifact }}
          path: dist/restore

      - name: Restore snapshot workspace
        id: restore-artifact
        if: inputs.restore_artifact != ''
        run: |
          set -euo pipefail
          echo "Manual recovery: restoring workspace from ${{ inputs.restore_artifact }}..."
          ARTIFACT_PATH=$(find dist/restore -name '*.tar.gz' -type f | head -n1)
          if [ -z "$ARTIFACT_PATH" ]; then
            echo "::error::No .tar.gz found in downloaded artifact ${{ inputs.restore_artifact }}"
            exit 1
          fi
          ./dist/huddlescope export validate --artifact "$ARTIFACT_PATH"
          ./dist/huddlescope export restore --artifact "$ARTIFACT_PATH" --data-dir web/data --content-dir web/content/stories --force
          echo "Snapshot workspace restored"

      # Issue #163 / HS-PORT-07 (AC-1, AC-2, AC-5): freshness decision step.
      # `ingest should-run` exits 0 on a correct verdict regardless of the
      # true/false verdict; it exits non-zero (no verdict) on a DB error, which
      # fails this step and the whole job (fail closed). The JSON contract is
      # secret-free.
      - name: Decide whether backup ingest should run
        id: decision
        if: inputs.restore_artifact == ''
        run: |
          set -euo pipefail
          echo "Querying Turso for ingest freshness (should-run)..."
          JSON=$(./dist/huddlescope ingest should-run --stale-after 75m --output json)
          echo "$JSON"
          SHOULD_RUN=$(echo "$JSON" | jq -r '.should_run')
          REASON=$(echo "$JSON" | jq -r '.reason')
          LAST_INGEST_AT=$(echo "$JSON" | jq -r '.last_successful_ingest_at // empty')
          echo "Decision: should_run=$SHOULD_RUN reason=$REASON last_ingest_at=${LAST_INGEST_AT:-unknown}"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "last_ingest_at=$LAST_INGEST_AT" >> "$GITHUB_OUTPUT"

      # Issue #163 / HS-PORT-07 (AC-1, AC-2, AC-6): backup ingest runs only
      # when the decision says should_run=true or the operator forced it.
      - name: Run backup ingest (when stale or forced)
        id: ingest
        if: inputs.restore_artifact == '' && (inputs.force_ingest == 'true' || steps.decision.outputs.should_run == 'true')
        run: |
          echo "Running backup ingestion pipeline..."
          if [ "${{ inputs.force_ingest }}" = "true" ]; then
            ./dist/huddlescope ingest run --mode backup --stale-after 75m --force
          else
            ./dist/huddlescope ingest run --mode backup --stale-after 75m
          fi
          echo "Ingestion step completed (or skipped under lease)"

      # Export always runs (the healthy case: ingest skipped, export + Hugo
      # proceed and may deploy). Export re-publishes site-data files as a
      # re-projection of the shared DB (issue #163 / AC-8). The writes are
      # workspace-only (untracked/ignored since issue #247).
      - name: Export snapshot to Hugo data
        id: export
        if: inputs.restore_artifact == ''
        run: |
          echo "Running export pipeline..."
          ./dist/huddlescope export run
          echo "Export completed"

      # Issue #249 / PUB-03 (AC-1, AC-2, AC-3): bundle the already-exported
      # Hugo workspace files into a deterministic, validated site-snapshot
      # artifact. The archive is packaged, independently re-validated, and
      # uploaded with if-no-files-found: error so a missing package fails the
      # job (the deploy job is skipped and the last-good Pages content is
      # preserved). The content-derived snapshotId names the artifact so a
      # specific deployment can be reproduced from it.
      - name: Package snapshot artifact
        id: package-snapshot
        if: inputs.restore_artifact == '' && steps.export.conclusion == 'success'
        run: |
          set -euo pipefail
          echo "Packaging the exported Hugo workspace into a site-snapshot artifact..."
          PKG_JSON=$(./dist/huddlescope export package --data-dir web/data --content-dir web/content/stories --out dist/site-snapshot --last-ingest "${{ steps.decision.outputs.last_ingest_at }}" --source-commit "${{ github.sha }}" --output json)
          echo "$PKG_JSON"
          SNAPSHOT_ID=$(echo "$PKG_JSON" | jq -r '.snapshotId')
          echo "snapshot_id=$SNAPSHOT_ID" >> "$GITHUB_OUTPUT"
          du -sh dist/site-snapshot.tar.gz

      - name: Validate snapshot artifact
        if: inputs.restore_artifact == '' && steps.package-snapshot.conclusion == 'success'
        run: |
          set -euo pipefail
          echo "Re-validating the site-snapshot artifact (independent pass)..."
          ./dist/huddlescope export validate --artifact dist/site-snapshot.tar.gz

      - name: Upload site-snapshot artifact
        if: inputs.restore_artifact == '' && steps.package-snapshot.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: site-snapshot-${{ steps.package-snapshot.outputs.snapshot_id }}
          path: dist/site-snapshot.tar.gz
          retention-days: 7
          if-no-files-found: error

      # Issue #247 / PUB-01 (AC-6): read the deployed manifest from the durable
      # store (Turso) into web/data/deployed.json (an untracked, ignored
      # workspace path) BEFORE the gate. `publish manifest get` exits 0 whether
      # or not a manifest is found (absent => no file); it exits non-zero only
      # on a DB read failure, which must fail closed (no deploy).
      - name: Load deployed manifest from store
        id: manifest-get
        if: inputs.restore_artifact == '' && steps.export.conclusion == 'success'
        run: |
          set -euo pipefail
          echo "Reading deployed manifest from the durable store..."
          ./dist/huddlescope publish manifest get --output web/data/deployed.json
          if [ -f web/data/deployed.json ]; then
            echo "Deployed manifest loaded from store"
          else
            echo "No deployed manifest found (never deployed; gate will fail closed with --require-manifest)"
          fi

      # Issue #229 / AC-2, AC-3 + issue #247 / AC-6: publish gate compares the
      # freshly exported snapshot against the last DEPLOYED manifest read from
      # the store. --require-manifest makes a missing stored manifest DENY
      # (fail closed) instead of the plain "never deployed" allow, so a
      # zero-story export can never deploy an empty site on a fresh checkout.
      # Exit codes: 0 allow/skip-identical, 3 deny, 1 invalid input.
      - name: Publish gate
        id: publish-gate
        if: inputs.restore_artifact == '' && steps.export.conclusion == 'success'
        run: |
          set -euo pipefail
          echo "Evaluating publish gate (candidate vs deployed manifest, require-manifest)..."
          GATE_JSON=$(./dist/huddlescope publish gate --candidate web/data/homepage.json --manifest web/data/deployed.json --require-manifest --output json) || {
            EXIT_CODE=$?
            if [ "$EXIT_CODE" -eq 3 ]; then
              echo "$GATE_JSON"
              echo "::warning::Publish gate denied: retaining last-known-good deployment"
              echo "verdict=deny" >> "$GITHUB_OUTPUT"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Publish gate failed (exit $EXIT_CODE): $GATE_JSON"
            exit 1
          }
          echo "$GATE_JSON"
          VERDICT=$(echo "$GATE_JSON" | jq -r '.verdict')
          echo "Gate verdict: $VERDICT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          if [ "$VERDICT" = "allow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$VERDICT" = "skip-identical" ]; then
            # Identical content: skip the deploy (quiesce the pipeline).
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected gate verdict: $VERDICT"
            exit 1
          fi

      # Site verification first (soft): site-test overlays fixture data and
      # rebuilds web/public/, so the real-data `make site` build below must
      # happen afterwards to guarantee the deployed artifact is the production
      # build, never the fixture build.
      - name: Install Hugo extended
        run: |
          HUGO_VERSION="0.169.0"
          HUGO_BINARY="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_BINARY}" | tar -xzf - hugo
          sudo mv hugo /usr/local/bin/
          echo "Hugo version: $(hugo version)"

      - name: Run site verification
        continue-on-error: true
        run: |
          chmod +x scripts/site-test.sh
          bash scripts/site-test.sh

      - name: Build Hugo site
        id: make-site
        run: |
          # The site-test step above rebuilt web/public from fixtures; Hugo
          # does not delete stale outputs, so start from a clean public dir
          # to guarantee the deployable artifact is the real-data build.
          rm -rf web/public
          make site

      - name: Verify no demo markers
        run: |
          # HS-056: the production build must never contain the demo sample.
          # Hard fail before any Pages upload.
          MARKERS='example\.com|seed-run-|top-free-agents-2024|pro-bowl-2025-format|preseason-week-1-overview'
          HITS=$(grep -RInE "$MARKERS" web/public/ 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Demo markers found in production build:"
            echo "$HITS"
            exit 1
          fi
          echo "No demo markers in web/public/"

      - name: Verify Hugo build artifacts
        run: |
          if [ ! -d web/public/ ]; then
            echo "::error::web/public/ directory not found"
            exit 1
          fi
          COVERAGE_COUNT=$(grep -c 'Covered by' web/public/index.html 2>/dev/null || echo 0)
          echo "Covered by count in index.html: $COVERAGE_COUNT"
          file_count=$(find web/public/ -type f | wc -l)
          echo "Total files in web/public/: $file_count"

      # Issue #250 / PUB-04 (AC6): rendered-HTML verification. The publish gate
      # compares JSON exports; verify-html compares the rendered
      # web/public/index.html against the candidate (and, when present, the
      # stored manifest), so a skeleton/zero-story render from a valid JSON
      # export (the #229 failure mode) is caught by the rendered artifact
      # itself. Hard fail (no continue-on-error) BEFORE any Pages upload: a
      # failure fails the build job, the deploy job is skipped, and the
      # last-known-good Pages content is preserved. The candidate is the
      # workspace homepage.json re-projected by export; the manifest is the
      # stored manifest read by manifest-get.
      - name: Verify rendered HTML against candidate
        id: verify-html
        if: steps.make-site.conclusion == 'success'
        run: |
          set -euo pipefail
          echo "Verifying rendered HTML against the candidate snapshot..."
          VERIFY_JSON=$(./dist/huddlescope publish verify-html --public web/public --candidate web/data/homepage.json --manifest web/data/deployed.json) || {
            EXIT_CODE=$?
            if [ "$EXIT_CODE" -eq 3 ]; then
              echo "$VERIFY_JSON"
              echo "::error::verify-html denied: retaining last-known-good deployment"
              echo "verdict=deny" >> "$GITHUB_OUTPUT"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::error::verify-html failed (exit $EXIT_CODE): $VERIFY_JSON"
            exit 1
          }
          echo "$VERIFY_JSON"
          echo "verify=pass" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.publish-gate.outputs.deploy }}" != "true" ]; then
            echo "verify passed but deploy already false (gate deny/skip); preserving decision"
          fi

      # Issue #249 / PUB-03 (AC-3): bind the rendered output (the separately
      # uploaded site-build artifact / Pages upload) to its snapshot and run
      # identity so a specific deployment can be traced back to the
      # site-snapshot artifact whose data produced it.
      - name: Write Pages binding manifest
        id: pages-binding
        run: |
          set -euo pipefail
          SNAPSHOT_ID="${{ steps.package-snapshot.outputs.snapshot_id }}"
          if [ -z "$SNAPSHOT_ID" ]; then
            SNAPSHOT_ID="unknown"
          fi
          ARCHIVE_SHA=$(shasum -a 256 dist/site-snapshot.tar.gz 2>/dev/null | awk '{print $1}' || echo unknown)
          INDEX_SHA=$(shasum -a 256 web/public/index.html 2>/dev/null | awk '{print $1}' || echo unknown)
          PAGE_COUNT=$(find web/public/ -type f | wc -l | tr -d ' ')
          cat > dist/pages-binding.json <<EOF
          {
            "snapshotId": "$SNAPSHOT_ID",
            "snapshotArchiveSha256": "$ARCHIVE_SHA",
            "githubRunId": "${{ github.run_id }}",
            "githubRunNumber": "${{ github.run_number }}",
            "githubSha": "${{ github.sha }}",
            "pageFileCount": $PAGE_COUNT,
            "indexHtmlSha256": "$INDEX_SHA"
          }
          EOF
          cat dist/pages-binding.json

      # Diagnostic artifact upload: gated on the build succeeding.
      - name: Upload site artifacts
        if: steps.export.conclusion == 'success' || steps.make-site.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: web/public/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Pages binding artifact
        if: steps.pages-binding.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pages-${{ github.run_id }}
          path: dist/pages-binding.json
          retention-days: 7
          if-no-files-found: ${{ (inputs.publish && (steps.publish-gate.outputs.deploy == 'true' || inputs.restore_artifact != '')) && 'error' || 'ignore' }}

      # issue #250 / PUB-04 (AC8): structured, secret-free run diagnostic.
      # `publish report` aggregates the run identity, the gate verdict, the
      # verify-html result, and the manifest into a single JSON report. The
      # report is non-secret by construction (run IDs, verdicts, counts,
      # timestamps, hashes) and is unit-tested against secret patterns.
      # Gated on export success so it only runs when the pipeline reached the
      # build stage; uploaded as a diagnostic artifact with 7-day retention.
      - name: Write publish diagnostic report
        id: publish-report
        if: steps.export.conclusion == 'success'
        run: |
          set -euo pipefail
          echo "Writing the publish diagnostic report..."
          ./dist/huddlescope publish report \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --commit "${{ github.sha }}" \
            --snapshot-id "${{ steps.package-snapshot.outputs.snapshot_id }}" \
            --output dist/publish-report.json
          cat dist/publish-report.json

      - name: Upload publish diagnostic artifact
        if: steps.publish-report.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pages-diag-${{ github.run_id }}
          path: dist/publish-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: inputs.publish && (steps.publish-gate.outputs.deploy == 'true' || inputs.restore_artifact != '')
        uses: actions/configure-pages@v6

      - name: Upload artifact to GitHub Pages
        if: inputs.publish && (steps.publish-gate.outputs.deploy == 'true' || inputs.restore_artifact != '')
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/public/

  deploy:
    name: Deploy to Pages
    needs: build
    # Issue #249 / PUB-03 (AC-4): the manual-recovery path bypasses the
    # publish gate ONLY when the operator explicitly set publish=true AND
    # named a restore_artifact; the manifest put below still runs so the
    # durable store catches up.
    if: inputs.publish && (needs.build.outputs.deploy == 'true' || inputs.restore_artifact != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build unified CLI
        run: make build-huddlescope

      # Issue #247 / PUB-01 (AC-6): re-project the production snapshot into the
      # workspace (web/data is untracked/ignored; a fresh checkout has no
      # homepage.json). The export reads Turso — the same DB the build job
      # exported from — so the candidate matches what was deployed. This step
      # also makes the manifest put's --candidate available. HSC_PUBLISH_SITE_DATA
      # is set so the site-data files are written to the workspace.
      - name: Re-project production snapshot
        env:
          HSC_ENV: production
          HSC_STORAGE_BACKEND: turso
          HSC_PUBLISH_SITE_DATA: "true"
          HSC_HUGO_BASE_URL: https://huddlescope.github.io/
          HSC_USER_AGENT: huddlescope-ci/0.1 (+https://huddlescope.github.io/)
          HSC_LOOKBACK: 24h
        run: |
          set -euo pipefail
          echo "Re-projecting production snapshot for manifest stamp..."
          ./dist/huddlescope export run
          echo "Export completed"

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # issue #247 / PUB-01 (AC-6) + issue #250 / PUB-04 (AC3, AC4): after a
      # successful deploy, record what was actually deployed in the durable
      # store (Turso) via `publish manifest put`. The put is monotonic (never
      # lowers the stored generatedAt) and records the v2 binding fields
      # (snapshotId, lastIngestAt, sourceCommit, runId) so a deployment is
      # traceable to the exact validated artifact. No Git commit/PR (the
      # manifest is no longer a tracked file). The candidate is the workspace
      # homepage.json re-projected by export; the commit SHA is the CI-validated
      # revision of this run. A failed put does NOT undo the deploy; the next
      # run re-deploys (correct, just noisy).
      - name: Record deployed manifest in store
        id: stamp-manifest
        if: success()
        env:
          HSC_ENV: production
          HSC_STORAGE_BACKEND: turso
        run: |
          set -euo pipefail
          echo "Recording deployed manifest in the durable store..."
          COMMIT_SHA="${{ github.sha }}"
          RUN_ID="${{ github.run_id }}"
          ./dist/huddlescope publish manifest put --candidate web/data/homepage.json --commit "$COMMIT_SHA" --run-id "$RUN_ID" --source-commit "$COMMIT_SHA"
          echo "Deployed manifest recorded in the durable store"

      # issue #250 / PUB-04 (AC9): live smoke. After a successful deploy, curl
      # the live site and assert the homepage rendered ("Data as of" present
      # and at least one story card). Soft (continue-on-error: true): a
      # transient Pages propagation lag fails the observation, NOT the run —
      # the durable gate + verify-html already protected the deploy, and the
      # manifest was only advanced after the Pages deploy succeeded.
      - name: Verify live site smoke (soft)
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Smoke-checking the live site post-deploy..."
          SITE_URL="https://huddlescope.github.io/"
          BODY=$(curl -fsSL --max-time 30 "$SITE_URL" || echo "")
          if [ -z "$BODY" ]; then
            echo "::warning::Live site returned no body (Pages propagation lag?)"
            exit 0
          fi
          if ! echo "$BODY" | grep -q "Data as of"; then
            echo "::warning::Live site missing 'Data as of' freshness label"
            exit 0
          fi
          STORY_CARDS=$(echo "$BODY" | grep -c 'story-card' || echo 0)
          echo "Live site story-card count: $STORY_CARDS"
          if [ "$STORY_CARDS" -eq 0 ]; then
            echo "::warning::Live site has no story cards (skeleton render or propagation lag?)"
          fi
          echo "Live site smoke: OK"
