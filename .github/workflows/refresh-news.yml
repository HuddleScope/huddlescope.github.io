# GitHub Actions workflow for HuddleScope refresh and Pages deployment
# HS-018: Create GitHub Actions refresh and Pages deployment workflow
# Triggered manually via workflow_dispatch (Cloudflare is the authoritative scheduler)
#
# HS-056: the legacy "data safety guard" (git checkout of the committed demo
# homepage) is removed. Instead an explicit publish decision gates the
# homepage commit, the Pages upload, and the deploy job:
#   - exported snapshot has >= 1 story            -> deploy real data
#   - zero stories, but the committed snapshot
#     (git show HEAD:) previously had >= 1 story  -> retain last-good, skip deploy
#   - zero stories, and never a real snapshot     -> deploy the clearly-labelled
#     "No stories published yet" empty state (truthful generatedAt)
# A failed ingest/export fails the build job, so the deploy job is skipped and
# the last successfully deployed Pages content is preserved.
#
# HS-PORT-07 (issue #163): ingest is a BACKUP that runs only when Turso is
# stale (>75 min). A `should-run` decision step (fail-closed on DB error)
# gates the ingest step; export and site-data re-projection always run so the
# committed web/data files stay coherent with Turso even when ingest is
# skipped. The site-data commit is a single step gated on export success that
# commits to a short-lived branch, opens a PR, waits for the required Build
# check, and squash-merges (the "Require CI before merging to main" ruleset
# rejects direct pushes to main).

name: Refresh news

on:
  # Manually trigger a news refresh and optional Pages deployment
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy to Pages after successful build'
        required: true
        default: 'true'
        type: boolean
      run-retention:
        description: 'Run retention (export package, commit, archive) after build verification'
        required: true
        default: 'true'
        type: boolean
      force_ingest:
        description: 'Force backup ingest even if Turso is fresh (maintenance only; still respects the distributed lease)'
        required: false
        default: 'false'
        type: boolean

# Cancel in-progress runs of this workflow on new dispatches
# Safe-state: build job is cancelled if a new dispatch starts; deploy only runs
# on a completed build, so no in-progress publish can be corrupted by a
# subsequent run. The upload-pages-artifact step defaults to fail-if-empty
# and artifacts have if-no-files-found: ignore only for diagnostics.
concurrency:
  group: refresh-news-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: default read access. The build job needs contents:write for
# the single site-data commit+push step (issue #163 / AC-7). GitHub Actions
# only honors permissions at workflow and job level (never step level), so it
# is granted on the whole build job; the deploy job additionally needs
# pages:write + id-token:write for its OIDC Pages deploy.
permissions:
  contents: read

jobs:
  build:
    name: Refresh and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    environment:
      name: github-pages
    outputs:
      deploy: ${{ steps.publish-decision.outputs.deploy }}
    env:
      HSC_ENV: production
      HSC_STORAGE_BACKEND: turso
      HSC_RUNNER_ORIGIN: github-backup
      # issue #158 / AC-5: GitHub Actions runs in the repo, so it publishes the
      # site-data files (heartbeat.json + feeds.json) to keep the committed
      # versions fresh. A repo-less VPS/Raspberry host leaves this unset
      # (auto) and skips the writes in production.
      HSC_PUBLISH_SITE_DATA: "true"
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      HSC_HUGO_BASE_URL: https://huddlescope.github.io/
      HSC_USER_AGENT: huddlescope-ci/0.1 (+https://huddlescope.github.io/)
      HSC_LOOKBACK: 24h
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "HuddleScope CI"
          git config user.email "ci@huddlescope.github.io"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build unified CLI
        run: make build-huddlescope

      # Issue #163 / HS-PORT-07 (AC-1, AC-2, AC-5): freshness decision step.
      # `ingest should-run` exits 0 on a correct query regardless of the
      # true/false verdict; it exits non-zero (no verdict) on a DB error, which
      # fails this step and the whole job (fail closed — never assume staleness
      # when we cannot reach Turso). The JSON contract is secret-free.
      - name: Decide whether backup ingest should run
        id: decision
        run: |
          set -euo pipefail
          echo "Querying Turso for ingest freshness (should-run)..."
          JSON=$(./dist/huddlescope ingest should-run --stale-after 75m --output json)
          echo "$JSON"
          SHOULD_RUN=$(echo "$JSON" | jq -r '.should_run')
          REASON=$(echo "$JSON" | jq -r '.reason')
          echo "Decision: should_run=$SHOULD_RUN reason=$REASON"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      # Issue #163 / HS-PORT-07 (AC-1, AC-2, AC-6): backup ingest runs only
      # when the decision says should_run=true or the operator forced it.
      # A skipped step is non-failing, so a false decision flows into export.
      # --mode backup re-validates under the distributed lease; --stale-after
      # 75m is the issue's stated backup contract. --force (when
      # force_ingest=true) skips only the staleness pre-check, NEVER the lease.
      - name: Run backup ingest (when stale or forced)
        id: ingest
        if: inputs.force_ingest == 'true' || steps.decision.outputs.should_run == 'true'
        run: |
          echo "Running backup ingestion pipeline..."
          if [ "${{ inputs.force_ingest }}" = "true" ]; then
            ./dist/huddlescope ingest run --mode backup --stale-after 75m --force
          else
            ./dist/huddlescope ingest run --mode backup --stale-after 75m
          fi
          echo "Ingestion step completed (or skipped under lease)"

      # Export always runs (the healthy case: ingest skipped, export + Hugo
      # proceed and may deploy). Export re-publishes site-data files as a
      # re-projection of the shared DB (issue #163 / AC-8).
      - name: Export snapshot to Hugo data
        id: export
        run: |
          echo "Running export pipeline..."
          ./dist/huddlescope export run
          echo "Export completed"

      # HS-056 publish decision: compare the freshly exported story count with
      # the pre-export committed state (git show HEAD:). Gated on export
      # success (no if: always() on a decision that drives commit/deploy).
      - name: Publish decision
        id: publish-decision
        if: steps.export.conclusion == 'success'
        run: |
          # Decide whether to commit/deploy the freshly exported snapshot.
          # STORY_COUNT reads the working tree (the new export); PREV_STORY_COUNT
          # reads the pre-export committed state (git show HEAD:). After HS-056
          # the homepage file is untracked until the first successful export
          # commits it, so PREV < 1 means "never had a real snapshot".
          STORY_COUNT=$(jq -r '.stories | length' web/data/homepage.json 2>/dev/null || echo 0)
          PREV_STORY_COUNT=$(git show HEAD:web/data/homepage.json 2>/dev/null | jq -r '.stories | length' 2>/dev/null || echo 0)
          echo "Stories in exported snapshot: $STORY_COUNT (committed: $PREV_STORY_COUNT)"
          if [ "$STORY_COUNT" -ge 1 ]; then
            DEPLOY=true
          elif [ "$PREV_STORY_COUNT" -ge 1 ]; then
            # Zero stories, but a prior real snapshot exists: retain the
            # last-good deployed content and do not commit the zero-story file.
            echo "::warning::Exported snapshot has no stories; retaining last-known-good homepage (no deploy)"
            DEPLOY=false
          else
            # Zero stories and never a real snapshot: publish the clearly-
            # labelled empty state ("No stories published yet").
            DEPLOY=true
          fi
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"

      # Issue #163 / HS-PORT-07 (AC-7): exactly one commit+push step, gated on
      # export success, limited to the three site-data files. contents:write is
      # granted at job level on `build` (step-level permissions are not
      # supported by GitHub Actions).
      #
      # The ruleset "Require CI before merging to main" requires the `Build`
      # status check on every commit to main, which a direct push cannot
      # satisfy (CI is triggered by the push itself). So the step commits to a
      # short-lived branch, opens a PR, waits for the Build check, and
      # squash-merges. No [skip ci]: the check must run.
      - name: Commit and push site-data files
        id: commit-and-push-site-data
        if: steps.export.conclusion == 'success'
        run: |
          set -euo pipefail
          # Stage the site-data files. homepage.json is committed only when the
          # publish decision is deploy=true (so a zero-story export with a prior
          # real snapshot does not clobber the last-good committed snapshot).
          git add web/data/heartbeat.json web/data/feeds.json
          if [ "${{ steps.publish-decision.outputs.deploy }}" = "true" ]; then
            git add web/data/homepage.json
          fi
          if [ -z "$(git status --porcelain web/data/)" ]; then
            echo "Site-data unchanged, skipping commit"
            exit 0
          fi
          # Commit to a short-lived branch: direct pushes to main are rejected
          # by the "Require CI before merging to main" ruleset (GH013).
          BRANCH="ci/site-data-$(git rev-parse --short HEAD)-$$"
          git checkout -b "$BRANCH"
          git commit -m "Update site-data (heartbeat, feeds, homepage) (Closes #108)"
          git push origin "$BRANCH"
          # Open a PR and wait for the required Build check to pass (~7 min).
          PR_URL=$(gh pr create \
            --title "Update site-data (heartbeat, feeds, homepage)" \
            --body "Automated site-data refresh by the Refresh news workflow (Closes #108)." \
            --json url --jq .url)
          PR_NUM="${PR_URL##*/}"
          echo "Opened PR $PR_NUM; waiting for the required Build check..."
          for _ in $(seq 1 60); do
            STATE=$(gh pr view "$PR_NUM" --json statusCheckRollup --jq '.statusCheckRollup.state')
            case "$STATE" in
              SUCCESS|NEUTRAL|SKIPPED|STALE) break ;;
              FAILURE|CANCELLED|TIMED_OUT)
                echo "::error::PR $PR_NUM checks did not pass (state=$STATE)"
                exit 1 ;;
            esac
            sleep 30
          done
          gh pr merge "$PR_NUM" --squash --delete-branch
          echo "Site-data committed and merged to main via PR $PR_NUM"

      # Site verification first (soft): site-test overlay(s) fixture data and
      # rebuilds web/public/, so the real-data `make site` build below must
      # happen afterwards to guarantee the deployed artifact is the production
      # build, never the fixture build.
      - name: Install Hugo extended
        run: |
          HUGO_VERSION="0.169.0"
          HUGO_BINARY="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_BINARY}" | tar -xzf - hugo
          sudo mv hugo /usr/local/bin/
          echo "Hugo version: $(hugo version)"

      - name: Run site verification
        continue-on-error: true
        run: |
          chmod +x scripts/site-test.sh
          bash scripts/site-test.sh

      - name: Build Hugo site
        id: make-site
        run: |
          # The site-test step above rebuilt web/public from fixtures; Hugo
          # does not delete stale outputs, so start from a clean public dir
          # to guarantee the deployable artifact is the real-data build.
          rm -rf web/public
          make site

      - name: Verify no demo markers
        run: |
          # HS-056: the production build must never contain the demo sample.
          # Hard fail before any Pages upload.
          MARKERS='example\.com|seed-run-|top-free-agents-2024|pro-bowl-2025-format|preseason-week-1-overview'
          HITS=$(grep -RInE "$MARKERS" web/public/ 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Demo markers found in production build:"
            echo "$HITS"
            exit 1
          fi
          echo "No demo markers in web/public/"

      # Retention (issue #120 / HS-065): runs after all DB reads (ingest,
      # export, site build) so the deployed snapshot is unaffected. The
      # ordering is load-bearing: export -> commit -> apply. A failed export
      # or commit fails the build job (no continue-on-error), so apply never
      # runs without a persisted package in Git (AC-2).
      - name: Retention export
        id: retention-export
        if: inputs.run-retention
        run: |
          echo "Exporting rows older than the retention window..."
          ./dist/huddlescope retention export --output archive/retention
          echo "Retention export completed"

      - name: Commit retention package
        id: retention-commit
        if: inputs.run-retention
        run: |
          # Persist the exported package in Git BEFORE the delete commits.
          # A no-op export (no expiring rows) leaves nothing staged: a valid
          # skip. Any failure here fails the job; apply is skipped.
          if [ -d archive/retention ] && [ -n "$(git status --porcelain archive/retention)" ]; then
            git add archive/retention
            git commit -m "Retention package: archive rows expiring outside window (Closes #120) [skip ci]"
            echo "Retention package committed"
          else
            echo "No retention package to commit (no expiring rows), skipping"
          fi

      - name: Retention apply
        id: retention-apply
        if: inputs.run-retention
        run: |
          echo "Archiving rows older than the retention window..."
          ./dist/huddlescope retention apply
          echo "Retention apply completed"

      - name: Verify Hugo build artifacts
        run: |
          if [ ! -d web/public/ ]; then
            echo "::error::web/public/ directory not found"
            exit 1
          fi
          # Debug: count "Covered by" occurrences
          COVERAGE_COUNT=$(grep -c 'Covered by' web/public/index.html 2>/dev/null || echo 0)
          echo "Covered by count in index.html: $COVERAGE_COUNT"
          file_count=$(find web/public/ -type f | wc -l)
          echo "Total files in web/public/: $file_count"

      # Diagnostic artifact upload: gated on the build succeeding (no
      # if: always() so a failed build never uploads a corrupt artifact).
      - name: Upload site artifacts
        if: steps.export.conclusion == 'success' || steps.make-site.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: web/public/
          retention-days: 7
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        if: inputs.publish && steps.publish-decision.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact to GitHub Pages
        if: inputs.publish && steps.publish-decision.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/public/

  deploy:
    name: Deploy to Pages
    needs: build
    if: inputs.publish && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
