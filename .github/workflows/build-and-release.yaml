# Build & Release workflow (issue #203)
#
# Builds static Linux binaries (amd64, arm64, armv7l) from the tagged commit
# or from main (on manual dispatch) and uploads them as assets of a GitHub
# Release named v${VERSION}.
#
# Version resolution is delegated to scripts/resolve-version.sh so that this
# workflow and the later Docker image workflow (issue #204) resolve the exact
# same version string for a given run (acceptance criteria AC-2 / AC-10 of
# the issue: the binary's stamped version must match the Docker image tag).
#
# Design notes (see plan.md §3):
#   - workflow_dispatch builds `main` (not the dispatching branch) so we never
#     publish unmerged branch code under a computed version.
#   - The release is created via the preinstalled `gh` CLI (no third-party
#     release action); the create-or-upload-`--clobber` branch makes re-runs
#     idempotent after a partial asset upload.
#   - `contents: write` is scoped to the `release` job only; the `build` job
#     runs with the workflow-level `contents: read` default (token minimization).

name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # linux targets are release assets; darwin/arm64 is a dev-only artifact
        # (uploaded as a GitHub artifact, never attached to the release —
        # releases stay Linux-only per issue #161 AC-4).
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: linux,  goarch: arm,   goarm: '7' }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 so `git describe` (used by resolve-version.sh on the
          # dispatch/describe path) can see the full tag history.
          fetch-depth: 0
          # Dispatch builds main, not the dispatching branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: version
        run: echo "version=$(bash scripts/resolve-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build static binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          # BUILT_AT is deterministic (commit timestamp) so re-runs of the same
          # commit+version produce byte-identical artifacts (issue #161 AC-3).
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT_AT="$(git log -1 --format=%ct | { read -r ts; date -u -d "@$$ts" +%Y-%m-%dT%H:%M:%SZ; })"
          go build -trimpath \
            -ldflags="-s -w \
              -X github.com/HuddleScope/huddlescope.github.io/internal/cli.cliVersion=${{ steps.version.outputs.version }} \
              -X github.com/HuddleScope/huddlescope.github.io/internal/cli.cliCommit=${COMMIT} \
              -X github.com/HuddleScope/huddlescope.github.io/internal/cli.cliBuiltAt=${BUILT_AT}" \
            -o "huddlescope_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}" \
            ./cmd/huddlescope

      - name: Verify static linking
        run: |
          BIN="huddlescope_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if readelf -d "$BIN" 2>/dev/null | grep -q NEEDED; then
            echo "FAIL: $BIN has a dynamic (NEEDED) section" >&2
            exit 1
          fi
          echo "OK: $BIN is statically linked"
          # armv7l (linux/arm) cannot be executed natively on the runner; verify
          # its ELF arch field instead (AC-4: each artifact reports its own arch).
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "arm" ]; then
            arch="$(readelf -h "$BIN" 2>/dev/null | awk -F: '/Machine/ {print $2}' | tr -d ' ')"
            echo "ELF Machine: $arch"
            case "$arch" in *ARM*) echo "OK: arm target" ;; *) echo "FAIL: unexpected ELF machine $arch" >&2; exit 1 ;; esac
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: huddlescope-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: huddlescope_*
          retention-days: 1

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Resolve version
        id: version
        run: echo "version=$(bash scripts/resolve-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: huddlescope-*
          merge-multiple: true

      - name: Verify stamp (amd64 runs natively on the runner)
        run: |
          out="$(./huddlescope_${{ steps.version.outputs.version }}_linux_amd64 version)"
          echo "$out"
          if ! printf '%s\n' "$out" | grep -q "${{ steps.version.outputs.version }}"; then
            echo "FAIL: stamped version not found in `huddlescope version` output" >&2
            exit 1
          fi

      - name: Verify stamp + arch (arm64/armv7l cannot run natively — check ELF)
        run: |
          # The runner (linux/amd64) cannot execute the arm64/armv7l binaries,
          # so verify their architecture via the ELF header instead (AC-4).
          for arch in arm64 arm; do
            BIN="huddlescope_${{ steps.version.outputs.version }}_linux_${arch}"
            if [ -f "$BIN" ]; then
              machine="$(readelf -h "$BIN" 2>/dev/null | awk -F: '/Machine/ {print $2}' | tr -d ' ')"
              echo "$BIN -> ELF Machine: $machine"
            fi
          done

      - name: Generate checksums
        # SHA256SUMS is the canonical checksum manifest name (issue #161 AC-4);
        # operators verify with `sha256sum -c SHA256SUMS`.
        run: sha256sum huddlescope_* > SHA256SUMS

      - name: Create or update release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # Release assets are Linux-only (issue #161 AC-4); the darwin/arm64
          # dev artifact is excluded from the release and stays a GitHub
          # artifact only.
          LINUX_ASSETS=$(ls huddlescope_*_linux_* 2>/dev/null || true)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber $LINUX_ASSETS SHA256SUMS
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --target main \
              --notes "huddlescope ${{ steps.version.outputs.version }} (commit ${{ github.sha }})" \
              $LINUX_ASSETS SHA256SUMS
          fi
