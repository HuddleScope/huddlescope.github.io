# HuddleScope NFL Feed Sources Configuration
# 
# This file defines all NFL RSS/Atom feed sources for HuddleScope.
# Sources are polled in priority order (lower number polled first).
# 
# Field descriptions:
#   id: Unique identifier for the source (snake_case, e.g., espn-nfl)
#   name: Display name for the source
#   url: Full RSS/Atom feed URL (must start with http:// or https://)
#   category: Type of source (draft, national, aggregator, all-sports, team-official)
#   enabled: true to poll this source, false to skip
#   verification: How the feed was verified (directory_listed, confirmed_xml, etc.)
#   publication: Publisher name for display (optional, defaults to name)
#   priority: Lower number polled first (default: 0)
#   team: NFL team abbreviation for team-specific feeds (optional)
#   language: BCP-47 language tag (default: en)
#   timeout: HTTP timeout in seconds (default: 0 = global default)
#   license: License or acceptable-use notes (default: "")
#   acceptable_use: allowed, restricted, or unknown (default: unknown)
#
# Note: This file is read at startup. Changes require application restart.

sources:
  # === National/League-Wide Sources ===
  - id: walterfootball
    name: WalterFootball
    publication: WalterFootball
    url: https://walterfootball.com/feed
    category: draft
    enabled: true
    verification: directory_listed
    priority: 10
    acceptable_use: allowed

  - id: espn-nfl
    name: ESPN — NFL
    publication: ESPN  NFL
    url: https://www.espn.com/espn/rss/nfl/news
    category: national
    enabled: false
    verification: bot_protection
    priority: 1
    acceptable_use: allowed

  - id: espn-fantasy
    name: ESPN Fantasy
    publication: ESPN Fantasy
    url: https://www.espn.com/fantasy/football/rss
    category: all-sports
    enabled: true
    verification: confirmed_xml
    priority: 2
    acceptable_use: allowed

  - id: cbs-nfl
