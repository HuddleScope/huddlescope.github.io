# HuddleScope NFL Teams Configuration
#
# This file defines all NFL teams for entity extraction and grouping.
# Each team has a unique slug (used in URLs), official name, short name,
# abbreviation, and common aliases for matching in news text.
#
# Field descriptions:
#   slug: URL-friendly identifier (lowercase, hyphenated, e.g., "new-york-giants")
#   name: Full legal team name (e.g., "New York Giants")
#   short_name: Short team name (e.g., "Giants")
#   abbreviation: Official NFL abbreviation (e.g., "NYG")
#   aliases: Common alternative names and nicknames (optional)
#   division: NFL division (AFC East/North/West, NFC East/North/West) (optional)
#
# Note: This file is read at startup. Changes require application restart.

